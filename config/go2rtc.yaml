# ==============================================================================
# ENLACE-DOORIA: GO2RTC GATEWAY DE VÍDEO CFTV
# Configuração Endurecida para Rede Local Segura (LAN / Guarita Física)
# Versão: go2rtc v1.9.4
# ==============================================================================

api:
  listen: ":1984"
  # Restrição de origem: não permitir wildcard origin: "*" indiscriminado
  # A API administrativa do go2rtc aceita requisições diretas da LAN da guarita e rede interna
  origin: ""

webrtc:
  listen: ":8555/tcp"
  # Candidatos ICE locais da guarita (utiliza IP do servidor na rede local física)
  # Operação estritamente local-first sem dependência de servidores STUN públicos não auditados
  candidates:
    - "${LOCAL_SERVER_IP:-127.0.0.1}:8555"

rtsp:
  # Servidor RTSP local interno
  listen: "127.0.0.1:8554"

streams:
  # Câmera 1: Totem da Portaria Social (Intelbras XPE 3115 IP)
  camera_portaria:
    - "${GO2RTC_CAMERA_PORTARIA_URL}"
    - "ffmpeg:camera_portaria#video=copy#audio=opus"

  # Câmera 2: Portão Garagem LPR (Intelbras VIP 3230 B)
  camera_garagem:
    - "${GO2RTC_CAMERA_GARAGEM_URL}"

  # Câmera 3: Hall de Entrada Social (Hikvision DS-2CD1123G0-I)
  camera_hall:
    - "${GO2RTC_CAMERA_HALL_URL}"

  # Câmera 4: Espaço Gourmet (Dahua IPC-HDBW1230E)
  camera_gourmet:
    - "${GO2RTC_CAMERA_GOURMET_URL}"
