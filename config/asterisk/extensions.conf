; ==============================================================================
; ENLACE-DOORIA: PLANO DE DISCAGEM ASTERISK 20 LTS (DIALPLAN SEGURO)
; Tratamento de Comandos DTMF (*07 Pedestre / *08 Garagem) e URA de Atendimento
; ==============================================================================

[general]
static=yes
writeprotect=no

[dooria-features]
; Acionamento DTMF durante chamada ativa (Decodificado e enviado ao Policy Engine)
; *07 - Portão Social de Pedestres
exten => _*07,1,NoOp([DOORIA-DTMF] Comando de Abertura Pedestre (*07) acionado por ${CALLERID(num)})
 same => n,System(curl -s -X POST http://127.0.0.1:3000/api/v1/calls/dtmf -H "Content-Type: application/json" -d '{"dtmf":"*07","caller":"${CALLERID(num)}"}')
 same => n,Playback(beep)
 same => n,Return()

; *08 - Portão de Garagem
exten => _*08,1,NoOp([DOORIA-DTMF] Comando de Abertura Garagem (*08) acionado por ${CALLERID(num)})
 same => n,System(curl -s -X POST http://127.0.0.1:3000/api/v1/calls/dtmf -H "Content-Type: application/json" -d '{"dtmf":"*08","caller":"${CALLERID(num)}"}')
 same => n,Playback(beep)
 same => n,Return()

[dooria-totem]
; Chamadas originadas pelo totem na calçada
exten => _XXX,1,NoOp([DOORIA] Discagem do Totem para Apartamento ${EXTEN})
 same => n,Set(TARGET_UNIT=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unanswered)

 same => n(busy),NoOp([DOORIA] Apartamento ocupado - Rota alternativa MaIA)
 same => n,Goto(dooria-ura-maia,s,1)

 same => n(unanswered),NoOp([DOORIA] Apartamento nao atendeu - Redirecionando para URA MaIA)
 same => n,Goto(dooria-ura-maia,s,1)

[dooria-intercom]
; Chamadas entre ramais e moradores
exten => _XXX,1,Dial(PJSIP/${EXTEN},30,tTkK)
 same => n,Hangup()

[dooria-ura-maia]
exten => s,1,NoOp([DOORIA] Atendimento Autônomo Concierge MaIA)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/maia_saudacao)
 same => n,Hangup()
