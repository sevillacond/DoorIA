; ==============================================================================
; ENLACE-DOORIA: ASTERISK MANAGEMENT INTERFACE (AMI) - CONFIGURAÇÃO SEGURA
; ==============================================================================
; As credenciais e regras de ACL do usuário AMI são geradas e injetadas
; dinamicamente a partir das variáveis de ambiente pelo asterisk-entrypoint.sh.
; Topologia: Asterisk em network_mode: host, DoorIA Core na subnet restrita
; do Docker (172.28.0.0/24).
; Bindaddr 0.0.0.0 combinado obrigatoriamente com:
;   deny = 0.0.0.0/0.0.0.0 (bloqueio irrestrito de qualquer rede externa/WAN/Internet)
;   permit = 127.0.0.1/255.255.255.255 (loopback)
;   permit = 172.28.0.0/255.255.255.0 (subnet restrita da bridge dooria-network)
; NENHUM segredo padrão/conhecido ou exposição a 0.0.0.0/0 é permitido.
; ==============================================================================

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no

