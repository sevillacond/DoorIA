; ==============================================================================
; ENLACE-DOORIA: ASTERISK MANAGEMENT INTERFACE (AMI) - CONFIGURAÇÃO SEGURA
; ==============================================================================
; As credenciais do usuário AMI são injetadas dinamicamente a partir das variáveis
; de ambiente (ASTERISK_AMI_USERNAME e ASTERISK_AMI_SECRET) pelo asterisk-entrypoint.sh.
; Topologia: Asterisk em network_mode: host, DoorIA Core na rede Docker bridge.
; Bindaddr 0.0.0.0 combinado obrigatoriamente com deny 0.0.0.0/0.0.0.0 e permit
; restrito a loopback (127.0.0.1) e subnets privadas autorizadas (Docker bridge / LAN).
; NENHUM segredo padrão/conhecido ou default é permitido no repositório.
; ==============================================================================

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no

