; ==============================================================================
; ENLACE-DOORIA: CONFIGURAÇÃO PJSIP ASTERISK 20 LTS PURE
; Piloto São Luís - MA (12 Unidades / Totem XPE 3115 IP / WebRTC)
; ==============================================================================

; ------------------------------------------------------------------------------
; Transportes de Rede (SIP UDP 5060 padrão e WebSocket Seguro WSS 8089 para WebRTC)
; ------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.1.0/24
local_net=172.16.0.0/12

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; ------------------------------------------------------------------------------
; Template Base para Ramais dos Apartamentos (WebRTC / Opus & Alaw)
; ------------------------------------------------------------------------------
[endpoint-template](!)
type=endpoint
context=dooria-intercom
disallow=all
allow=opus
allow=alaw
allow=ulaw
dtmf_mode=rfc4733
direct_media=no
ice_support=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=no
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
dtls_ca_file=/etc/asterisk/keys/ca.crt
dtls_setup=actpass

; ------------------------------------------------------------------------------
; Totem da Portaria Externa (Intelbras XPE 3115 IP)
; ------------------------------------------------------------------------------
[aor-totem-xpe]
type=aor
max_contacts=1

[auth-totem-xpe]
type=auth
auth_type=userpass
username=xpe3115
password=xpe_secure_pass_2026

[totem-xpe]
type=endpoint
context=dooria-totem
disallow=all
allow=alaw
allow=ulaw
allow=h264
dtmf_mode=rfc4733
aors=aor-totem-xpe
auth=auth-totem-xpe

; ------------------------------------------------------------------------------
; Ramais dos Apartamentos (101 a 104, 201 a 204, 301 a 304)
; ------------------------------------------------------------------------------
[101](endpoint-template)
aors=101
auth=auth-101

[101]
type=aor
max_contacts=3

[auth-101]
type=auth
auth_type=userpass
username=101
password=sip_pass_101_secure

[201](endpoint-template)
aors=201
auth=auth-201

[201]
type=aor
max_contacts=3

[auth-201]
type=auth
auth_type=userpass
username=201
password=sip_pass_201_secure
